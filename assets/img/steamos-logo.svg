<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Logotipo do Steam">
  <!-- Steam-style: dark rounded square with the crank/piston emblem -->
  <rect x="4" y="4" width="92" height="92" rx="18" fill="#171A21"/>
  <g stroke-linecap="round" transform="translate(4,-2)">
    <!-- big crank circle -->
    <circle cx="38" cy="60" r="17" fill="none" stroke="#66C0F4" stroke-width="5"/>
    <circle cx="38" cy="60" r="5" fill="#66C0F4"/>
    <!-- small piston circle -->
    <circle cx="72" cy="40" r="12" fill="none" stroke="#B8B6B4" stroke-width="5"/>
    <circle cx="72" cy="40" r="4" fill="#B8B6B4"/>
    <!-- crank arm -->
    <path d="M38 60 L72 40" stroke="#B8B6B4" stroke-width="5"/>
  </g>
</svg>
