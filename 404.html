<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada — Curso Completo de SteamOS</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font-family: "SteamOS", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #fff; color: #171210; line-height: 1.6; text-align: center;
  }
  @media (prefers-color-scheme: dark) { body { background: #17100F; color: #F5F0ED; } }
  .caixa { max-width: 34rem; }
  svg { width: 84px; height: 84px; margin: 0 auto 26px; display: block; }
  h1 { font-size: clamp(28px, 6vw, 42px); font-weight: 300; letter-spacing: -.02em; margin-bottom: 12px; }
  h1 b { color: #E95420; font-weight: 700; }
  p { opacity: .75; margin-bottom: 26px; }
  a {
    display: inline-block; padding: 11px 26px; border-radius: 26px;
    background: #E95420; color: #fff; text-decoration: none; font-weight: 500;
  }
  a:hover { background: #C7431A; }
</style>
</head>
<body>
  <div class="caixa">
    <svg viewBox="0 0 100 100" role="img" aria-label="Logotipo do SteamOS">
      <g fill="#E95420" stroke="#E95420">
        <circle cx="50" cy="50" r="30" fill="none" stroke-width="11"
                stroke-dasharray="43 19.8319" transform="rotate(-71 50 50)"/>
        <circle cx="50" cy="20" r="9" stroke="none"/>
        <circle cx="24.02" cy="65" r="9" stroke="none"/>
        <circle cx="75.98" cy="65" r="9" stroke="none"/>
      </g>
    </svg>
    <h1>Erro <b>404</b></h1>
    <p>Essa página não existe neste curso. Os capítulos e subcapítulos ficam todos
       dentro da página principal — volte para lá e use o sumário ou a busca.</p>
    <a href="./">Voltar ao início do curso</a>
  </div>
</body>
</html>
